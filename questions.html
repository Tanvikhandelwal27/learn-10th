<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Filter GYANORA Class 10 question practice by subject, chapter, marks, and type for quick revision and exam prep.">
  <title>Question Bank · GYANORA</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/gyanora-mark.svg?v=20261003">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css?v=20261024" rel="stylesheet">
</head>

<body>
  <main id="main-content" class="container">
    <div id="page-breadcrumb"></div>
    <header class="page-intro">
      <div class="eyebrow">GYANORA · Class 10</div>
      <h1>Question bank</h1>
      <p>Original prompts to practise recalling, explaining, and connecting ideas from each chapter.</p>
    </header>
    <section class="section-tight">
      <form class="filter-row" id="question-filters">
        <div class="filter-field"><label for="question-subject">Subject</label><select id="question-subject"></select>
        </div>
        <div class="filter-field"><label for="question-chapter">Chapter</label><select id="question-chapter"></select>
        </div>
        <div class="filter-field"><label for="question-marks">Marks</label><select id="question-marks">
            <option value="all">All marks</option>
            <option value="1">1 mark</option>
            <option value="2">2 marks</option>
            <option value="3">3 marks</option>
            <option value="4">4 marks</option>
            <option value="5">5 marks</option>
          </select></div>
        <div class="filter-field"><label for="question-type">Question type</label><select id="question-type">
            <option value="all">All types</option>
            <option>MCQ</option>
            <option>True/False</option>
            <option>Assertion/Reason</option>
            <option>Case-based</option>
            <option>Concept/Application</option>
            <option>Very Short Answer</option>
            <option>Short Answer</option>
            <option>Long Answer</option>
            <option>Case Based</option>
          </select></div>
      </form>
      <p id="question-count" aria-live="polite" style="margin:16px 0 10px"></p>
      <div class="question-grid" id="question-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="js/data.js?v=20261015"></script>
  <script src="js/economics-content.js?v=20261001"></script>
  <script src="js/enrichment.js?v=20261001"></script>
  <script src="js/chapter-completion.js?v=20261006"></script>
  <script src="js/quiz-bank.js?v=20261022"></script>
  <script src="js/main.js?v=20261011"></script>
  <script src="js/search.js?v=20261001"></script>
  <script src="js/questions.js?v=20261001"></script>
</body>

</html>
